[project]
name = "caparazon-shell"
version = "0.1.0"
description = "Shell de escritorio para KDE Plasma con paleta dinamica"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "pytest>=8",
    "python-dateutil>=2.9",
    "ruff>=0.8",
    "types-python-dateutil>=2.9",
]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.11"
pythonPlatform = "Linux"
include = ["tests", "modules/secondmenu/gcal.py"]
exclude = [
    "**/__pycache__",
    "**/.venv",
]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py311"
line-length = 88
src = [".", "tests"]
include = ["tests/**/*.py", "modules/secondmenu/gcal.py"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "FBT001",
    "FBT002",
    "TD002",
    "TD003",
    "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"modules/secondmenu/gcal.py" = [
    "DTZ001",
    "DTZ007",
    "EM101",
    "EM102",
    "INP001",
    "PLC0415",
    "PLR0913",
    "S310",
    "S603",
    "S607",
    "T201",
    "TRY003",
]
"tests/**/*.py" = [
    "S101",
    "ARG",
    "PLR2004",
    "SLF001",
    "D",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = ["error"]
